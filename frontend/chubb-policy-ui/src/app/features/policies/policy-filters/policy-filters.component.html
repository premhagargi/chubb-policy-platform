<form class="filters" aria-label="Filter policies" (submit)="$event.preventDefault()">
  <div class="field">
    <label for="filter-search">Search</label>
    <input
      id="filter-search"
      type="search"
      aria-label="Search policies by number, policyholder, or underwriter"
      placeholder="Policy #, policyholder, underwriter…"
      [value]="filter.search ?? ''"
      (input)="onSearchInput($any($event.target).value)"
    />
  </div>

  <div class="field">
    <label for="filter-status">Status</label>
    <select id="filter-status" [value]="filter.status ?? ''" (change)="onSelectChange('status', $any($event.target).value)">
      <option value="">All statuses</option>
      @for (status of statuses; track status) {
        <option [value]="status">{{ status }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="filter-lob">Line of business</label>
    <select id="filter-lob" [value]="filter.lineOfBusiness ?? ''" (change)="onSelectChange('lineOfBusiness', $any($event.target).value)">
      <option value="">All lines</option>
      @for (lob of linesOfBusiness; track lob) {
        <option [value]="lob">{{ lob }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="filter-region">Region</label>
    <select id="filter-region" [value]="filter.region ?? ''" (change)="onSelectChange('region', $any($event.target).value)">
      <option value="">All regions</option>
      @for (region of regions; track region) {
        <option [value]="region">{{ region }}</option>
      }
    </select>
  </div>

  <div class="field">
    <label for="filter-from">Effective from</label>
    <input id="filter-from" type="date" [value]="filter.effectiveDateFrom ?? ''" (change)="onSelectChange('effectiveDateFrom', $any($event.target).value)" />
  </div>

  <div class="field">
    <label for="filter-to">Effective to</label>
    <input id="filter-to" type="date" [value]="filter.effectiveDateTo ?? ''" (change)="onSelectChange('effectiveDateTo', $any($event.target).value)" />
  </div>

  <button type="button" class="clear-btn" (click)="clearAll()">Clear filters</button>
</form>
